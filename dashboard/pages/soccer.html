<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket 足球赛事</title>
    <style id="theme-vars">

  --pm-primary-50: #eafffb;
  --pm-primary-100: #c7fff4;

  --pm-primary-300: #4ffadd;
  --pm-primary-400: #1ee8cc;
  --pm-primary-500: #05c4ad;

  --pm-primary-700: #007e73;
  --pm-primary-800: #00635b;
  --pm-primary-900: #00514b;
  --pm-neutral-0: #ffffff;
  --pm-neutral-50: #f7f8f8;
  --pm-neutral-100: #eceeef;
  --pm-neutral-200: #d5dadd;
  --pm-neutral-300: #adb5ba;
  --pm-neutral-400: #818b93;
  --pm-neutral-500: #616b74;
  --pm-neutral-600: #4a535b;
  --pm-neutral-700: #3e454c;
  --pm-neutral-800: #353a40;
  --pm-neutral-900: #2d3136;
  --pm-neutral-950: #0b0c0e;
  --pm-background: #0b0c0e;
  --pm-foreground: #f7f8f8;
  --pm-card: #141619;
  --pm-card-foreground: #f7f8f8;
  --pm-popover: #1a1d21;
  --pm-popover-foreground: #f7f8f8;
  --pm-primary: #05c4ad;
  --pm-primary-foreground: #0b0c0e;
  --pm-muted: #1a1d21;
  --pm-muted-foreground: #818b93;
  --pm-border: #2d3136;
  --pm-input: #1a1d21;
  --pm-ring: #05c4ad;
  --pm-state-success: #22c55e;
  --pm-state-warning: #f59e0b;
  --pm-state-error: #ef4444;
  --pm-state-info: #3b82f6;
  --pm-radius-xs: 2px;
  --pm-radius-sm: 4px;
  --pm-radius-md: 8px;
  --pm-radius-lg: 16px;
  --pm-radius-pill: 999px;
  --pm-shadow-1: 0 1px 2px rgba(0,0,0,0.25), 0 1px 1px rgba(0,0,0,0.15);
  --pm-shadow-2: 0 8px 24px -8px rgba(0,0,0,0.45);
  --pm-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --pm-font-mono: "JetBrains Mono", "SF Mono", "Fira Code", ui-monospace, monospace;
}
.dark {
  --pm-background: #0b0c0e;
  --pm-foreground: #f7f8f8;
  --pm-card: #141619;
  --pm-card-foreground: #f7f8f8;
  --pm-popover: #1a1d21;
  --pm-popover-foreground: #f7f8f8;
  --pm-primary: #05c4ad;
  --pm-primary-foreground: #0b0c0e;
  --pm-muted: #1a1d21;
  --pm-muted-foreground: #818b93;
  --pm-border: #2d3136;
  --pm-input: #1a1d21;
  --pm-ring: #05c4ad;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--pm-background);
    --color-foreground: var(--pm-foreground);
    --color-card: var(--pm-card);
    --color-card-foreground: var(--pm-card-foreground);
    --color-popover: var(--pm-popover);
    --color-popover-foreground: var(--pm-popover-foreground);
    --color-primary: var(--pm-primary);
    --color-primary-foreground: var(--pm-primary-foreground);
    --color-muted: var(--pm-muted);
    --color-muted-foreground: var(--pm-muted-foreground);
    --color-border: var(--pm-border);
    --color-input: var(--pm-input);
    --color-ring: var(--pm-ring);
    --radius-sm: var(--pm-radius-sm);
    --radius-md: var(--pm-radius-md);
    --radius-lg: var(--pm-radius-lg);
  }
  @layer base {
    body { background: var(--pm-background); color: var(--pm-foreground); font-family: var(--pm-font-sans); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
    .font-mono { font-family: var(--pm-font-mono); }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--pm-background); }
      .text-background { color: var(--pm-background); }
      .border-background { border-color: var(--pm-background); }
      .ring-background { --tw-ring-color: var(--pm-background); }
      .bg-foreground { background-color: var(--pm-foreground); }
      .text-foreground { color: var(--pm-foreground); }
      .border-foreground { border-color: var(--pm-foreground); }
      .ring-foreground { --tw-ring-color: var(--pm-foreground); }
      .bg-card { background-color: var(--pm-card); }
      .text-card { color: var(--pm-card); }
      .border-card { border-color: var(--pm-card); }
      .ring-card { --tw-ring-color: var(--pm-card); }
      .bg-card-foreground { background-color: var(--pm-card-foreground); }
      .text-card-foreground { color: var(--pm-card-foreground); }
      .border-card-foreground { border-color: var(--pm-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--pm-card-foreground); }
      .bg-popover { background-color: var(--pm-popover); }
      .text-popover { color: var(--pm-popover); }
      .border-popover { border-color: var(--pm-popover); }
      .ring-popover { --tw-ring-color: var(--pm-popover); }
      .bg-popover-foreground { background-color: var(--pm-popover-foreground); }
      .text-popover-foreground { color: var(--pm-popover-foreground); }
      .border-popover-foreground { border-color: var(--pm-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--pm-popover-foreground); }
      .bg-primary { background-color: var(--pm-primary); }
      .text-primary { color: var(--pm-primary); }
      .border-primary { border-color: var(--pm-primary); }
      .ring-primary { --tw-ring-color: var(--pm-primary); }
      .bg-primary-foreground { background-color: var(--pm-primary-foreground); }
      .text-primary-foreground { color: var(--pm-primary-foreground); }
      .border-primary-foreground { border-color: var(--pm-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--pm-primary-foreground); }
      .bg-muted { background-color: var(--pm-muted); }
      .text-muted { color: var(--pm-muted); }
      .border-muted { border-color: var(--pm-muted); }
      .ring-muted { --tw-ring-color: var(--pm-muted); }
      .bg-muted-foreground { background-color: var(--pm-muted-foreground); }
      .text-muted-foreground { color: var(--pm-muted-foreground); }
      .border-muted-foreground { border-color: var(--pm-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--pm-muted-foreground); }
      .bg-border { background-color: var(--pm-border); }
      .text-border { color: var(--pm-border); }
      .border-border { border-color: var(--pm-border); }
      .ring-border { --tw-ring-color: var(--pm-border); }
      .bg-input { background-color: var(--pm-input); }
      .text-input { color: var(--pm-input); }
      .border-input { border-color: var(--pm-input); }
      .ring-input { --tw-ring-color: var(--pm-input); }
      .bg-ring { background-color: var(--pm-ring); }
      .text-ring { color: var(--pm-ring); }
      .border-ring { border-color: var(--pm-ring); }
      .ring-ring { --tw-ring-color: var(--pm-ring); }
    </style>
    <style id="critical-layout">
      html, body, #app-shell { height: 100%; overflow: hidden; }
      body { margin: 0; }
      #app-shell { display: flex; flex-direction: column; }
      #soccer-main { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
      .panel-scroll { overflow: auto; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      @media (max-width: 640px) {
        .match-grid { grid-template-columns: 1fr; }
      }
      .outcome-card { transition: all 120ms ease; }
      .outcome-card:hover { transform: translateY(-1px); }
      .outcome-card.selected { ring: 2px; --tw-ring-color: var(--pm-primary); border-color: var(--pm-primary); }
      .price-flash-up { animation: flashUp 600ms ease; }
      .price-flash-down { animation: flashDown 600ms ease; }
      @keyframes flashUp { 0% { background-color: rgba(34,197,94,0.25); } 100% { background-color: transparent; } }
      @keyframes flashDown { 0% { background-color: rgba(239,68,68,0.25); } 100% { background-color: transparent; } }
      #match-drawer { transform: translateX(100%); transition: transform 250ms ease; }
      #match-drawer.open { transform: translateX(0); }
    </style>
</head>
<body class="antialiased bg-background text-foreground">
    <div id="app-shell" data-viewport-mode="app-shell">
        <header data-region="header" class="shrink-0 border-b border-border bg-card">
            <div class="flex items-center justify-between gap-4 px-4 py-3">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="flex h-9 w-9 items-center justify-center rounded-md bg-primary text-primary-foreground">
                        <i data-lucide="activity" class="h-5 w-5"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-base font-semibold leading-tight text-foreground truncate">Polymarket 足球赛事</h1>
                        <p class="text-xs text-muted-foreground truncate">点击比赛查看实时盘口</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                    <a href="/" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-background px-3 py-1.5 text-xs font-medium text-foreground hover:bg-muted transition-colors">
                        <i data-lucide="layout-dashboard" class="h-3.5 w-3.5"></i>
                        主控台
                    </a>
                    <a href="/translations" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-background px-3 py-1.5 text-xs font-medium text-foreground hover:bg-muted transition-colors">
                        <i data-lucide="languages" class="h-3.5 w-3.5"></i>
                        翻译
                    </a>
                    <button id="btn-refresh" data-dom-id="btn-refresh" type="button" class="inline-flex items-center gap-1.5 rounded-md bg-primary px-3 py-1.5 text-xs font-medium text-primary-foreground hover:opacity-90 active:opacity-80 transition-opacity">
                        <i data-lucide="refresh-cw" class="h-3.5 w-3.5"></i>
                        刷新比赛
                    </button>
                </div>
            </div>
        </header>

        <main id="soccer-main" data-scroll-region="primary" class="overflow-y-auto p-4 pb-28">
            <div class="mx-auto max-w-6xl space-y-4">
                <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
                    <div class="rounded-lg border border-border bg-card p-3">
                        <p class="text-xs text-muted-foreground">进行中</p>
                        <p class="text-lg font-semibold text-[var(--pm-state-success)]"><span id="count-live">0</span> 场</p>
                    </div>
                    <div class="rounded-lg border border-border bg-card p-3">
                        <p class="text-xs text-muted-foreground">即将开始</p>
                        <p class="text-lg font-semibold text-[var(--pm-state-warning)]"><span id="count-upcoming">0</span> 场</p>
                    </div>
                    <div class="rounded-lg border border-border bg-card p-3">
                        <p class="text-xs text-muted-foreground">已结束</p>
                        <p class="text-lg font-semibold text-muted-foreground"><span id="count-ended">0</span> 场</p>
                    </div>
                    <div class="rounded-lg border border-border bg-card p-3">
                        <p class="text-xs text-muted-foreground">当前筛选</p>
                        <p class="text-lg font-semibold text-foreground"><span id="match-count">0</span> 场</p>
                    </div>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div id="filter-tabs" class="flex flex-wrap gap-2"></div>
                    <div class="flex items-center gap-3 text-xs text-muted-foreground">
                        <span>状态：<span id="fetch-status">加载中...</span></span>
                        <span>更新：<span id="last-updated">--</span></span>
                    </div>
                </div>

                <div id="matches-list" class="space-y-3">
                    <!-- Matches rendered here -->
                </div>
            </div>
        </main>

        <aside id="match-drawer" class="fixed right-0 top-0 z-50 h-full w-full sm:w-[480px] translate-x-full bg-card border-l border-border shadow-[var(--pm-shadow-2)] flex flex-col">
            <div class="shrink-0 border-b border-border px-4 py-3 flex items-center justify-between gap-3">
                <div class="min-w-0">
                    <h2 id="drawer-title" class="text-sm font-semibold truncate">--</h2>
                    <p id="drawer-subtitle" class="text-xs text-muted-foreground truncate">--</p>
                </div>
                <button id="btn-close-drawer" type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-md border border-border bg-background text-foreground hover:bg-muted transition-colors">
                    <i data-lucide="x" class="h-4 w-4"></i>
                </button>
            </div>
            <div id="drawer-body" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div id="drawer-loading" class="text-center py-8 text-xs text-muted-foreground">加载中...</div>
                <div id="drawer-markets" class="hidden space-y-3"></div>
                <div id="drawer-empty" class="hidden text-center py-8 text-xs text-muted-foreground">暂无盘口</div>
            </div>
            <div class="shrink-0 border-t border-border px-4 py-2">
                <div class="flex items-center gap-2 text-[10px] text-muted-foreground">
                    <span class="inline-flex h-2 w-2 rounded-full bg-[var(--pm-state-success)]" id="ws-dot"></span>
                    <span id="ws-status">未连接</span>
                </div>
            </div>
        </aside>

        <footer id="order-panel" class="fixed bottom-0 left-0 right-0 border-t border-border bg-card/95 backdrop-blur-sm px-4 py-3 hidden">
            <div class="mx-auto max-w-6xl">
                <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                    <div class="min-w-0">
                        <p class="text-xs text-muted-foreground">已选盘口</p>
                        <p id="selected-label" class="truncate text-sm font-medium text-foreground">--</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-3">
                        <div class="flex items-center gap-2 rounded-md border border-border bg-background p-1">
                            <button type="button" id="side-buy" class="rounded px-3 py-1.5 text-xs font-medium transition-colors bg-primary text-primary-foreground">买入</button>
                            <button type="button" id="side-sell" class="rounded px-3 py-1.5 text-xs font-medium transition-colors text-foreground hover:bg-muted">卖出</button>
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-xs text-muted-foreground">数量</label>
                            <input id="order-size" type="number" value="10" step="1" min="1" class="w-20 rounded-md border border-border bg-input px-2 py-1.5 text-xs text-foreground outline-none focus:border-primary font-mono" />
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-xs text-muted-foreground">价格</label>
                            <input id="order-price" type="number" value="0.50" step="0.001" min="0.001" max="0.999" class="w-24 rounded-md border border-border bg-input px-2 py-1.5 text-xs text-foreground outline-none focus:border-primary font-mono" />
                        </div>
                        <button id="btn-submit-order" data-dom-id="btn-submit-order" type="button" class="inline-flex items-center gap-1.5 rounded-md bg-primary px-4 py-1.5 text-xs font-medium text-primary-foreground hover:opacity-90 active:opacity-80 transition-opacity">
                            <i data-lucide="send" class="h-3.5 w-3.5"></i>
                            下单
                        </button>
                        <button id="btn-cancel-order" type="button" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-background px-3 py-1.5 text-xs font-medium text-foreground hover:bg-muted transition-colors">
                            取消
                        </button>
                    </div>
                </div>
                <p id="order-message" class="mt-2 hidden text-xs"></p>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            lucide.createIcons();

            let events = [];
            let selected = null;
            let currentSide = 'BUY';
            let currentFilter = 'focus';
            let counts = { all: 0, live: 0, not_started: 0, ended: 0 };
            let ws = null;
            let wsPingInterval = null;
            let activeEventId = null;
            let livePrices = {}; // tokenId -> { bid, ask, price }

            const matchesList = document.getElementById('matches-list');
            const matchCount = document.getElementById('match-count');
            const fetchStatus = document.getElementById('fetch-status');
            const lastUpdated = document.getElementById('last-updated');
            const orderPanel = document.getElementById('order-panel');
            const selectedLabel = document.getElementById('selected-label');
            const orderSize = document.getElementById('order-size');
            const orderPrice = document.getElementById('order-price');
            const orderMessage = document.getElementById('order-message');
            const btnBuy = document.getElementById('side-buy');
            const btnSell = document.getElementById('side-sell');
            const drawer = document.getElementById('match-drawer');
            const drawerTitle = document.getElementById('drawer-title');
            const drawerSubtitle = document.getElementById('drawer-subtitle');
            const drawerLoading = document.getElementById('drawer-loading');
            const drawerMarkets = document.getElementById('drawer-markets');
            const drawerEmpty = document.getElementById('drawer-empty');
            const wsStatus = document.getElementById('ws-status');
            const wsDot = document.getElementById('ws-dot');

            matchesList.addEventListener('click', (e) => {
                const card = e.target.closest('.match-card');
                if (!card) return;
                const evt = events.find((x) => String(x.id) === card.dataset.eventId);
                if (evt) openMatch(evt);
            });

            matchesList.addEventListener('keydown', (e) => {
                const card = e.target.closest('.match-card');
                if (!card || (e.key !== 'Enter' && e.key !== ' ')) return;
                e.preventDefault();
                const evt = events.find((x) => String(x.id) === card.dataset.eventId);
                if (evt) openMatch(evt);
            });

            function formatNumber(n) {
                if (n === null || n === undefined) return '-';
                const num = Number(n);
                if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(2) + 'K';
                return num.toLocaleString(undefined, { maximumFractionDigits: 2 });
            }

            function formatTime(iso) {
                if (!iso) return '--';
                const d = new Date(iso.includes(' ') ? iso.replace(' ', 'T') + 'Z' : iso);
                if (isNaN(d.getTime())) return iso;
                return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            }

            function matchStatusInfo(status) {
                const map = {
                    not_started: { label: '未开始', cls: 'bg-[var(--pm-state-warning)]/15 text-[var(--pm-state-warning)] border-[var(--pm-state-warning)]/30' },
                    live: { label: '进行中', cls: 'bg-[var(--pm-state-success)]/15 text-[var(--pm-state-success)] border-[var(--pm-state-success)]/30' },
                    ended: { label: '已结束', cls: 'bg-muted text-muted-foreground border-border' },
                };
                return map[status] || map.not_started;
            }

            function escapeHtml(str) {
                return String(str ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            }

            function renderFilters() {
                const container = document.getElementById('filter-tabs');
                if (!container) return;
                container.innerHTML = '';
                const tabs = [
                    { key: 'focus', label: `重点（进行中/即将开始）` },
                    { key: 'live', label: `进行中 (${counts.live})` },
                    { key: 'not_started', label: `即将开始 (${counts.not_started})` },
                    { key: 'ended', label: `已结束 (${counts.ended})` },
                    { key: 'all', label: `全部 (${counts.all})` },
                ];
                tabs.forEach((tab) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    const active = currentFilter === tab.key;
                    btn.className = 'filter-tab rounded-md border px-3 py-1.5 text-xs font-medium transition-colors ' +
                        (active
                            ? 'border-primary bg-primary/10 text-primary'
                            : 'border-border bg-card text-foreground hover:bg-muted');
                    btn.textContent = tab.label;
                    btn.addEventListener('click', () => {
                        currentFilter = tab.key;
                        renderFilters();
                        renderMatches();
                    });
                    container.appendChild(btn);
                });
            }

            function renderMatches() {
                matchesList.innerHTML = '';

                const filtered = events.filter((e) => {
                    if (currentFilter === 'all') return true;
                    if (currentFilter === 'focus') return e.match_status === 'live' || e.match_status === 'not_started';
                    return e.match_status === currentFilter;
                });

                counts = {
                    all: events.length,
                    live: events.filter((e) => e.match_status === 'live').length,
                    not_started: events.filter((e) => e.match_status === 'not_started').length,
                    ended: events.filter((e) => e.match_status === 'ended').length,
                };
                document.getElementById('count-live').textContent = String(counts.live);
                document.getElementById('count-upcoming').textContent = String(counts.not_started);
                document.getElementById('count-ended').textContent = String(counts.ended);
                matchCount.textContent = String(filtered.length);
                renderFilters();

                if (!filtered.length) {
                    matchesList.innerHTML = `
                        <div class="rounded-lg border border-border bg-card p-8 text-center">
                            <p class="text-sm text-muted-foreground">当前筛选条件下暂无比赛</p>
                            <p class="mt-1 text-xs text-muted-foreground">点击右上角“刷新比赛”从 Polymarket 拉取并入库</p>
                        </div>`;
                    return;
                }

                filtered.forEach((evt) => {
                    const home = evt.home_team_zh || evt.home_team_en || '-';
                    const away = evt.away_team_zh || evt.away_team_en || '-';
                    const status = matchStatusInfo(evt.match_status);
                    const card = document.createElement('div');
                    card.className = 'match-card rounded-lg border border-border bg-card shadow-[var(--pm-shadow-1)] overflow-hidden cursor-pointer hover:border-primary/40 transition-colors';
                    card.dataset.eventId = evt.id;
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.innerHTML = `
                        <div class="flex items-center justify-between gap-3 px-4 py-3 pointer-events-none">
                            <div class="flex min-w-0 flex-1 items-center gap-3 pointer-events-none">
                                <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primary/10 text-primary pointer-events-none">
                                    <i data-lucide="trophy" class="h-4 w-4 pointer-events-none"></i>
                                </div>
                                <div class="min-w-0 pointer-events-none">
                                    <p class="truncate text-sm font-semibold text-foreground pointer-events-none">${escapeHtml(home)} <span class="text-muted-foreground">vs</span> ${escapeHtml(away)}</p>
                                    <p class="truncate text-xs text-muted-foreground pointer-events-none">${escapeHtml(evt.league || '足球')} · ${formatTime(evt.end_time)} · 成交量 ${formatNumber(evt.volume)}</p>
                                </div>
                            </div>
                            <div class="flex shrink-0 items-center gap-2 pointer-events-none">
                                <span class="inline-flex rounded-full border px-2 py-0.5 text-[10px] font-medium ${status.cls}">${status.label}</span>
                                <i data-lucide="chevron-right" class="h-4 w-4 text-muted-foreground pointer-events-none"></i>
                            </div>
                        </div>
                    `;
                    matchesList.appendChild(card);
                });

                lucide.createIcons();
            }

            function openMatch(evt) {
                activeEventId = evt.id;
                drawerTitle.textContent = evt.title_zh || evt.title_en;
                const status = matchStatusInfo(evt.match_status);
                drawerSubtitle.innerHTML = `${escapeHtml(evt.league || '足球')} · ${formatTime(evt.end_time)} · <span class="inline-flex rounded-full border px-2 py-0.5 text-[10px] font-medium ${status.cls}">${status.label}</span>`;
                drawer.classList.add('open');
                drawerLoading.classList.remove('hidden');
                drawerMarkets.classList.add('hidden');
                drawerEmpty.classList.add('hidden');
                livePrices = {};
                loadMarkets(evt.id);
            }

            function closeDrawer() {
                drawer.classList.remove('open');
                disconnectWs();
                activeEventId = null;
                livePrices = {};
            }

            document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && activeEventId) closeDrawer();
            });

            async function loadMarkets(eventId) {
                try {
                    const res = await fetch(`/api/soccer/events/${eventId}/markets`);
                    const data = await res.json();
                    if (data.success) {
                        renderDrawerMarkets(data.markets || []);
                        connectWs(data.markets || []);
                    } else {
                        throw new Error(data.error || '加载失败');
                    }
                } catch (err) {
                    drawerLoading.classList.add('hidden');
                    drawerEmpty.textContent = '加载失败：' + err.message;
                    drawerEmpty.classList.remove('hidden');
                }
            }

            const MARKET_TYPE_KEYWORDS = [
                [['halftime', 'half-time', 'half time'], 'halftime'],
                [['second half', '2nd half'], 'second_half'],
                [['exact score', 'correct score'], 'exact_score'],
                [['first team to score', 'first to score', 'first goal'], 'first_scorer'],
                [['total goals', 'over/under', 'o/u'], 'total'],
                [['spread', 'handicap', 'asian handicap'], 'spread'],
                [['both teams to score', 'btts'], 'btts'],
                [['corner', 'corners'], 'corners'],
                [['moneyline', 'winner', 'win the match', 'who will win'], 'moneyline'],
            ];

            const MARKET_TYPE_ORDER = ['moneyline', 'spread', 'total', 'btts', 'halftime', 'second_half', 'exact_score', 'first_scorer', 'corners', 'other'];

            const MARKET_TYPE_LABELS = {
                moneyline: '主要盘口',
                spread: '让球盘',
                total: '大小球',
                btts: '双方进球',
                halftime: '半场',
                second_half: '下半场',
                exact_score: '正确比分',
                first_scorer: '首先进球',
                corners: '角球',
                other: '其他',
            };

            function classifyMarketType(questionEn) {
                const lower = String(questionEn || '').toLowerCase();
                for (const [keywords, type] of MARKET_TYPE_KEYWORDS) {
                    if (keywords.some((k) => lower.includes(k))) return type;
                }
                if (/will\s+.+\s+(win|draw|tie)/.test(lower)) return 'moneyline';
                if (/end in a draw|end in a tie/.test(lower)) return 'moneyline';
                return 'other';
            }

            function getOutcomeColor(name, idx, total) {
                const lower = String(name).toLowerCase();
                if (lower === 'yes' || lower === '是') return 'var(--pm-state-success)';
                if (lower === 'no' || lower === '否') return 'var(--pm-state-error)';
                if (total === 2) {
                    return idx === 0 ? 'var(--pm-state-success)' : 'var(--pm-state-error)';
                }
                if (total === 3) {
                    if (idx === 0) return 'var(--pm-state-success)';
                    if (idx === 2) return 'var(--pm-state-error)';
                    return 'var(--pm-state-warning)';
                }
                return 'var(--pm-primary)';
            }

            function getOutcomeRoundedClass(idx, total) {
                if (total === 2) return idx === 0 ? 'rounded-l-md' : 'rounded-r-md';
                if (total === 3) {
                    if (idx === 0) return 'rounded-l-md';
                    if (idx === 2) return 'rounded-r-md';
                    return '';
                }
                return 'rounded-md';
            }

            function renderDrawerMarkets(markets) {
                drawerLoading.classList.add('hidden');
                drawerMarkets.innerHTML = '';
                if (!markets.length) {
                    drawerEmpty.classList.remove('hidden');
                    drawerMarkets.classList.add('hidden');
                    return;
                }
                drawerMarkets.classList.remove('hidden');
                drawerEmpty.classList.add('hidden');

                const grouped = {};
                MARKET_TYPE_ORDER.forEach((t) => { grouped[t] = []; });
                markets.forEach((market) => {
                    const type = market.market_type || classifyMarketType(market.question_en);
                    if (!grouped[type]) grouped[type] = [];
                    grouped[type].push(market);
                });

                MARKET_TYPE_ORDER.forEach((type) => {
                    const groupMarkets = grouped[type];
                    if (!groupMarkets || !groupMarkets.length) return;

                    const section = document.createElement('div');
                    section.className = 'space-y-3';
                    section.innerHTML = `<h3 class="text-xs font-semibold text-muted-foreground uppercase tracking-wider sticky top-0 bg-card py-2 z-10 border-b border-border">${escapeHtml(MARKET_TYPE_LABELS[type])}</h3>`;

                    groupMarkets.forEach((market) => {
                        const outcomes = Array.isArray(market.outcomes) ? market.outcomes : [];
                        const prices = Array.isArray(market.outcome_prices) ? market.outcome_prices : [];
                        const tokens = Array.isArray(market.clob_token_ids) ? market.clob_token_ids : [];

                        const card = document.createElement('div');
                        card.className = 'rounded-lg border border-border bg-card p-3';
                        card.dataset.marketId = market.id;

                        let gridClass = 'grid-cols-2';
                        if (outcomes.length === 3) gridClass = 'grid-cols-3';
                        else if (outcomes.length > 3) gridClass = 'grid-cols-2 sm:grid-cols-3';

                        const outcomesHtml = outcomes.map((_, idx) => renderOutcomeButton(market, idx, outcomes, prices, tokens)).join('');

                        card.innerHTML = `
                            <div class="mb-3">
                                <div class="flex items-start justify-between gap-2">
                                    <p class="text-sm font-medium text-foreground leading-snug">${escapeHtml(market.question_zh || market.question_en)}</p>
                                </div>
                                <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
                                    <span class="inline-flex rounded px-1.5 py-0.5 text-[10px] font-medium bg-muted text-muted-foreground">${escapeHtml(MARKET_TYPE_LABELS[type])}</span>
                                    ${market.line !== null && market.line !== undefined ? `<span class="inline-flex rounded px-1.5 py-0.5 text-[10px] font-medium bg-muted text-muted-foreground">盘口 ${market.line}</span>` : ''}
                                </div>
                            </div>
                            <div class="grid gap-2 ${gridClass}">
                                ${outcomesHtml}
                            </div>
                        `;
                        section.appendChild(card);

                        outcomes.forEach((_, oIdx) => {
                            const btn = card.querySelector(`[data-token-id="${escapeHtml(tokens[oIdx] || '')}"]`);
                            if (btn) {
                                btn.addEventListener('click', () => selectOutcome(market, oIdx, btn));
                            }
                        });
                    });

                    drawerMarkets.appendChild(section);
                });

                lucide.createIcons();
            }

            function renderOutcomeButton(market, idx, outcomes, prices, tokens) {
                const name = outcomes[idx] || '-';
                const tokenId = tokens[idx] || '';
                const initialPrice = Number(prices[idx] ?? 0);
                const accentColor = getOutcomeColor(name, idx, outcomes.length);
                const roundedClass = getOutcomeRoundedClass(idx, outcomes.length);

                return `
                    <button type="button" data-token-id="${escapeHtml(tokenId)}" data-outcome-idx="${idx}" data-market-id="${market.id}"
                        class="outcome-card group relative flex flex-col items-center justify-center gap-1 border border-border bg-background px-2 py-3 ${roundedClass}">
                        <span class="text-[10px] font-medium text-muted-foreground truncate max-w-full px-1">${escapeHtml(name)}</span>
                        <span class="text-lg font-bold font-mono" style="color:${accentColor}" data-price="${initialPrice.toFixed(3)}">${initialPrice ? (initialPrice * 100).toFixed(1) : '--'}%</span>
                    </button>
                `;
            }

            function connectWs(markets) {
                disconnectWs();
                const tokenIds = [];
                markets.forEach((m) => {
                    (m.clob_token_ids || []).forEach((id) => { if (id) tokenIds.push(id); });
                });
                if (!tokenIds.length) return;

                wsStatus.textContent = '连接中...';
                wsDot.className = 'inline-flex h-2 w-2 rounded-full bg-[var(--pm-state-warning)]';

                const wsUrl = 'wss://ws-subscriptions-clob.polymarket.com/ws/market';
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    wsStatus.textContent = '已连接';
                    wsDot.className = 'inline-flex h-2 w-2 rounded-full bg-[var(--pm-state-success)]';
                    ws.send(JSON.stringify({
                        type: 'market',
                        assets_ids: tokenIds,
                        custom_feature_enabled: true,
                    }));
                    wsPingInterval = setInterval(() => {
                        if (ws && ws.readyState === WebSocket.OPEN) ws.send('PING');
                    }, 10000);
                };

                ws.onmessage = (event) => {
                    if (event.data === 'PONG') return;
                    try {
                        const msg = JSON.parse(event.data);
                        handleWsMessage(msg);
                    } catch (err) {
                        console.warn('WS parse error', err);
                    }
                };

                ws.onerror = () => {
                    wsStatus.textContent = '连接错误';
                    wsDot.className = 'inline-flex h-2 w-2 rounded-full bg-[var(--pm-state-error)]';
                };

                ws.onclose = () => {
                    wsStatus.textContent = '已断开';
                    wsDot.className = 'inline-flex h-2 w-2 rounded-full bg-muted-foreground';
                    if (wsPingInterval) clearInterval(wsPingInterval);
                };
            }

            function disconnectWs() {
                if (wsPingInterval) clearInterval(wsPingInterval);
                if (ws) {
                    ws.close();
                    ws = null;
                }
                wsStatus.textContent = '未连接';
                wsDot.className = 'inline-flex h-2 w-2 rounded-full bg-muted-foreground';
            }

            function handleWsMessage(msg) {
                if (msg.event_type === 'book') {
                    const bestBid = msg.bids?.[0]?.price ? Number(msg.bids[0].price) : null;
                    const bestAsk = msg.asks?.[0]?.price ? Number(msg.asks[0].price) : null;
                    livePrices[msg.asset_id] = { bid: bestBid, ask: bestAsk };
                    updatePriceDisplay(msg.asset_id, bestBid, bestAsk);
                } else if (msg.event_type === 'price_change' && Array.isArray(msg.price_changes)) {
                    msg.price_changes.forEach((pc) => {
                        const bid = pc.best_bid !== undefined ? Number(pc.best_bid) : null;
                        const ask = pc.best_ask !== undefined ? Number(pc.best_ask) : null;
                        livePrices[pc.asset_id] = { bid, ask };
                        updatePriceDisplay(pc.asset_id, bid, ask);
                    });
                } else if (msg.event_type === 'best_bid_ask') {
                    const bid = msg.best_bid !== undefined ? Number(msg.best_bid) : null;
                    const ask = msg.best_ask !== undefined ? Number(msg.best_ask) : null;
                    if (msg.asset_id) {
                        livePrices[msg.asset_id] = { bid, ask };
                        updatePriceDisplay(msg.asset_id, bid, ask);
                    }
                }
            }

            function updatePriceDisplay(tokenId, bid, ask) {
                const btn = document.querySelector(`[data-token-id="${CSS.escape(tokenId)}"]`);
                if (!btn) return;
                const priceEl = btn.querySelector('[data-price]');
                if (!priceEl) return;

                const oldPrice = Number(priceEl.dataset.price);
                const price = bid !== null ? bid : (ask !== null ? ask : oldPrice);
                priceEl.textContent = price ? (price * 100).toFixed(1) + '%' : '--';
                priceEl.dataset.price = price.toFixed(3);

                btn.classList.remove('price-flash-up', 'price-flash-down');
                void btn.offsetWidth;
                if (price > oldPrice) btn.classList.add('price-flash-up');
                else if (price < oldPrice) btn.classList.add('price-flash-down');
            }

            function selectOutcome(market, outcomeIdx, btn) {
                document.querySelectorAll('.outcome-card.selected').forEach((b) => b.classList.remove('selected'));
                btn.classList.add('selected');
                const outcomes = Array.isArray(market.outcomes) ? market.outcomes : [];
                const tokens = Array.isArray(market.clob_token_ids) ? market.clob_token_ids : [];
                const prices = Array.isArray(market.outcome_prices) ? market.outcome_prices : [];
                const outcomeName = outcomes[outcomeIdx];
                const tokenId = tokens[outcomeIdx];
                const live = livePrices[tokenId];
                const price = live?.bid !== null && live?.bid !== undefined ? live.bid : Number(prices[outcomeIdx] || 0);

                const evt = events.find((e) => e.id === activeEventId);
                selected = {
                    eventId: activeEventId,
                    marketId: market.id,
                    tokenId,
                    outcomeName,
                    price,
                };
                orderPrice.value = price ? price.toFixed(3) : '0.500';
                selectedLabel.textContent = `${evt?.title_zh || evt?.title_en || ''} · ${market.question_zh || market.question_en} · ${outcomeName}`;
                orderPanel.classList.remove('hidden');
                orderMessage.classList.add('hidden');
            }

            function setSide(side) {
                currentSide = side;
                if (side === 'BUY') {
                    btnBuy.className = 'rounded px-3 py-1.5 text-xs font-medium transition-colors bg-primary text-primary-foreground';
                    btnSell.className = 'rounded px-3 py-1.5 text-xs font-medium transition-colors text-foreground hover:bg-muted';
                } else {
                    btnBuy.className = 'rounded px-3 py-1.5 text-xs font-medium transition-colors text-foreground hover:bg-muted';
                    btnSell.className = 'rounded px-3 py-1.5 text-xs font-medium transition-colors bg-[var(--pm-state-error)] text-white';
                }
            }

            btnBuy.addEventListener('click', () => setSide('BUY'));
            btnSell.addEventListener('click', () => setSide('SELL'));

            document.getElementById('btn-cancel-order').addEventListener('click', () => {
                orderPanel.classList.add('hidden');
                selected = null;
                document.querySelectorAll('.outcome-card.selected').forEach((b) => b.classList.remove('selected'));
            });

            document.getElementById('btn-submit-order').addEventListener('click', async () => {
                if (!selected) return;
                const size = Number(orderSize.value);
                const price = Number(orderPrice.value);
                if (!size || size <= 0 || price <= 0 || price >= 1) {
                    showMessage('请填写有效的数量和价格（0 < 价格 < 1）', true);
                    return;
                }
                try {
                    const res = await fetch('/api/soccer/order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            market_id: selected.marketId,
                            token_id: selected.tokenId,
                            side: currentSide,
                            size,
                            price,
                        }),
                    });
                    const data = await res.json();
                    showMessage(data.message || (data.success ? '下单成功' : '下单失败'), !data.success);
                } catch (err) {
                    showMessage('网络错误：' + err.message, true);
                }
            });

            function showMessage(text, isError) {
                orderMessage.textContent = text;
                orderMessage.className = 'mt-2 text-xs ' + (isError ? 'text-[var(--pm-state-error)]' : 'text-[var(--pm-state-success)]');
                orderMessage.classList.remove('hidden');
            }

            async function loadEvents() {
                fetchStatus.textContent = '加载中...';
                try {
                    const res = await fetch('/api/soccer/events');
                    const data = await res.json();
                    if (data.success) {
                        events = data.events || [];
                        renderMatches();
                        fetchStatus.textContent = '已连接';
                        lastUpdated.textContent = new Date().toLocaleTimeString('zh-CN');
                    } else {
                        throw new Error(data.error || '未知错误');
                    }
                } catch (err) {
                    fetchStatus.textContent = '失败';
                    console.error('加载赛事失败:', err);
                    matchesList.innerHTML = `
                        <div class="rounded-lg border border-border bg-card p-6 text-center">
                            <p class="text-sm text-[var(--pm-state-error)]">加载失败：${escapeHtml(err.message)}</p>
                            <p class="mt-1 text-xs text-muted-foreground">请确保后端服务已启动</p>
                        </div>`;
                }
            }

            document.getElementById('btn-refresh').addEventListener('click', async () => {
                const btn = document.getElementById('btn-refresh');
                btn.disabled = true;
                btn.classList.add('opacity-60');
                fetchStatus.textContent = '刷新中...';
                try {
                    const res = await fetch('/api/soccer/refresh', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        await loadEvents();
                        fetchStatus.textContent = `已刷新 ${data.events || 0} 场`;
                    } else {
                        throw new Error(data.error || '刷新失败');
                    }
                } catch (err) {
                    fetchStatus.textContent = '刷新失败';
                    alert('刷新失败：' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.classList.remove('opacity-60');
                }
            });

            loadEvents();
        })();
    </script>
</body>
</html>
